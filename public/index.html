<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Za labiryntem</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%230c0d10' width='16' height='16'/%3E%3Ccircle cx='8' cy='8' r='2.2' fill='none' stroke='%238f6a52'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="screen" class="is-menu" data-phase="boot" data-role="">
    <div id="world">
      <div id="map"><canvas id="stage"></canvas></div>
      <aside id="panel"></aside>
    </div>
    <div class="frame" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div id="lobby">
      <div class="plate" id="plate">
        <p class="kicker">Planeta bez nazwy</p>
        <h1>Za labiryntem</h1>
        <p class="lead">Nasłuchuję sygnału z ruiny…</p>
      </div>
    </div>
    <div id="intro" hidden>
      <p class="kicker">Planeta bez nazwy</p>
      <h1>Za labiryntem</h1>
      <div id="intro-lines"></div>
      <div class="menu-list">
        <button id="intro-go" type="button" hidden>Wejdź</button>
        <button id="intro-skip" type="button">Pomiń</button>
      </div>
      <p class="fine">Dotknij, żeby obudzić dźwięk.</p>
    </div>
    <div id="touch" hidden>
      <div id="stick-zone"></div>
      <div id="look-zone"></div>
    </div>
    <div id="stick" hidden><i></i></div>
    <div id="deck" hidden>
      <button id="sprint" type="button">Bieg</button>
      <button id="listen" type="button">Nasłuch</button>
      <button id="knock" type="button">Stuk</button>
    </div>
    <p id="hint" hidden></p>
    <div id="toast"></div>
    <button id="mute" type="button">Wycisz</button>
    <button id="full" type="button">Pełny ekran</button>
    <p id="pad-note" hidden>Pad podłączony</p>
    <p id="pad-help" hidden></p>
    <div id="waitbanner" class="is-off">
      <p id="wait-text"></p>
      <button id="wait-menu" type="button">Do menu</button>
    </div>
    <div id="result" class="is-off">
      <div class="result-card">
        <p class="kicker" id="result-kicker"></p>
        <h2 id="result-title"></h2>
        <p id="result-time"></p>
        <form id="score-form" hidden>
          <input id="score-name" maxlength="16" placeholder="Imię" aria-label="Imię" autocomplete="nickname">
          <button type="submit">Wpisz się</button>
        </form>
        <div class="menu-list">
          <button id="next" type="button">Dalej</button>
          <button id="quit-result" type="button">Do menu</button>
        </div>
      </div>
    </div>
    <button id="quit" type="button" hidden>Menu</button>
    <div id="smoke" hidden><i></i><i></i><i></i></div>
  </div>
  <script type="module" src="/client.js"></script>
</body>
</html>
