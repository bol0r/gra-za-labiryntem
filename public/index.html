<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Za labiryntem</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%230c0d10' width='16' height='16'/%3E%3Ccircle cx='8' cy='8' r='2.2' fill='none' stroke='%238f6a52'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="screen" class="is-menu" data-phase="boot" data-role="">
    <div id="world">
      <div id="map"><canvas id="stage"></canvas></div>
      <aside id="panel"></aside>
    </div>
    <div class="frame" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div id="lobby">
      <div class="plate" id="plate">
        <p class="kicker">Planeta bez nazwy</p>
        <h1>Za labiryntem</h1>
        <p class="lead">Nasłuchuję sygnału z ruiny…</p>
      </div>
    </div>
    <div id="touch" hidden>
      <div id="stick-zone"></div>
      <div id="look-zone"></div>
    </div>
    <div id="stick" hidden><i></i></div>
    <button id="sprint" type="button" hidden>Bieg</button>
    <p id="hint" hidden></p>
    <div id="toast"></div>
    <button id="mute" type="button">Wycisz</button>
    <div id="waitbanner" class="is-off"></div>
    <div id="result" class="is-off">
      <div class="result-card">
        <p class="kicker" id="result-kicker"></p>
        <h2 id="result-title"></h2>
        <p id="result-time"></p>
        <button id="next" type="button">Następna komora</button>
      </div>
    </div>
  </div>
  <script type="module" src="/client.js"></script>
</body>
</html>
